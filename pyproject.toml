[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "visigence-igad"
version = "1.0.2"
description = "Information-Geometric Anomaly Detection via Fisher–Rao Scalar Curvature"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
keywords = ["anomaly detection", "information geometry", "Fisher-Rao", "machine learning"]
authors = [
  { name = "Omry Damari", email = "omryv@pm.me" }
]
dependencies = [
  "numpy>=1.24,<3",
  "scipy>=1.10,<2",
  "scikit-learn>=1.2,<2",
  "matplotlib>=3.7,<4",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.optional-dependencies]
dev = [
  "build>=1.2,<2",
  "pytest>=9.0.3,<10",
  "pytest-html>=4.1,<5",
  "pytest-json-report>=1.5,<2",
  "pip-audit>=2.10,<3",
]

[project.urls]
Source = "https://github.com/Visigence/IGAD"
"Bug Tracker" = "https://github.com/Visigence/IGAD/issues"
"Validation Run" = "https://github.com/Visigence/IGAD/commit/81dd1eb4540643083854232d9645f6add4150512"

[tool.setuptools.packages.find]
exclude = ["tests", "tests.*", "experiments", "experiments.*"]

[tool.setuptools.package-data]
igad = ["py.typed"]
