name: Publish

on:
  release:
    types: [published]
  # Manual runs publish whatever main carries. Releases are immutable, so a
  # release whose own run failed can be published this way without a new tag.
  workflow_dispatch:

permissions:
  contents: read
  id-token: write  # Required for PyPI Trusted Publisher (OIDC)

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  publish:
    name: Build and publish to PyPI
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/visigence-igad
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v4

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Upgrade pip and install build tools
        run: python -m pip install --upgrade pip build

      - name: Build package
        run: python -m build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@ed0c53931b1dc9bd32cbe73a98c7f6766f8a527e  # v1.13.0
