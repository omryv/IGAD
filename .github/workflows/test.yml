name: Tests
on:
  push:
  pull_request:
  release:
    types: [published]
  # A manual run on main tests and then publishes main to PyPI.
  workflow_dispatch:
permissions:
  contents: read
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Upgrade pip and setuptools
        # The hosted Python images ship a setuptools that pip-audit flags
        # (PYSEC-2026-3447 in 79.0.1); the audit below covers it too.
        run: python -m pip install --upgrade pip setuptools

      - name: Install package with dev dependencies
        run: python -m pip install -e ".[dev]"

      - name: Audit dependencies
        run: python -m pip_audit

      - name: Run tests
        run: |
          pytest tests/ -v \
            --html=test_results.html \
            --self-contained-html \
            --json-report \
            --json-report-file=test_results.json
      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f  # v4
        with:
          name: test-report-python-${{ matrix.python-version }}
          path: |
            test_results.html
            test_results.json
          if-no-files-found: ignore

  # PyPI's trusted publisher for visigence-igad names this workflow file
  # (test.yml), so publishing lives here. It runs only for a published
  # release or a manual run, and only after every test job has passed.
  publish:
    name: Build and publish to PyPI
    needs: test
    if: github.event_name == 'release' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/visigence-igad
    permissions:
      contents: read
      id-token: write  # PyPI trusted publishing (OIDC)
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v4

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v5
        with:
          python-version: "3.12"

      - name: Build package
        run: |
          python -m pip install --upgrade pip build
          python -m build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@ed0c53931b1dc9bd32cbe73a98c7f6766f8a527e  # v1.13.0
        with:
          # A release and a manual run can both target the same version; the
          # second must not fail just because the first already uploaded it.
          skip-existing: true
