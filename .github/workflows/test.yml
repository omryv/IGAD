name: Tests

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]" pytest-html
      - run: pytest tests/ -v --html=test_results.html --self-contained-html
      - uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: test_results.html
